# ============================================================
#  SERVEUR FIVEM - CONFIGURATION LOCALHOST
#  Base ESX Framework
# ============================================================

# ---- Connexion MySQL ----
set mysql_connection_string "mysql://root:password@localhost/esx_fivem?charset=utf8mb4"

# ---- Infos Serveur ----
sv_hostname "Mon Serveur FiveM - DEV"
sv_maxclients 32
sv_licenseKey "changeme"           # Remplacer par ta clé sur https://keymaster.fivem.net

# ---- Locale ----
sets locale "fr-FR"
set sv_language "fr-FR"

# ---- Réseau (localhost) ----
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# ---- Steam (optionnel, commenter si pas besoin) ----
# set steam_webApiKey "CHANGEME"

# ---- OneSync ----
set onesync on

# ============================================================
#  RESOURCES - Chargement optimisé par dossier
#  L'ordre des dossiers est CRITIQUE:
#   0_Framework -> 1_Libs -> 2_ESXOfficial -> 3_ESXNonOfficial -> 4_StandAlone
# ============================================================

# ---- Ressources FiveM de base ----
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure hardcap
ensure basic-gamemode

# ---- 0_Framework: Coeur du serveur ----
ensure esx_core

# ---- 1_Libs: Librairies / Dépendances ----
ensure oxmysql

# ---- 2_ESXOfficial: Scripts ESX officiels ----
ensure esx_menu_default
ensure esx_progressbar
ensure esx_identity
ensure esx_skin

# ---- 3_ESXNonOfficial: Scripts ESX communautaires ----
# (Ajouter ici les scripts ESX non-officiels)

# ---- 4_StandAlone: Scripts indépendants ----
ensure esx_notify
ensure esx_hud

# ============================================================
#  PERMISSIONS & ADMIN
# ============================================================

# Ajouter les admins via leur identifiant license
add_ace group.admin command allow
add_ace group.admin command.quit deny
add_principal identifier.license:XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX group.admin

# ---- Commandes RCON ----
rcon_password "changeme_rcon"

# ============================================================
#  GAMEPLAY
# ============================================================

# Désactiver le voice chat natif (utiliser un script voice externe)
voice_useNativeAudio false
voice_useSendingRangeOnly true
