<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div id="hud">
        <div class="hud-bar" id="health-bar">
            <div class="hud-bar-fill" id="health-fill"></div>
            <span class="hud-label">VIE</span>
        </div>
        <div class="hud-bar" id="armour-bar">
            <div class="hud-bar-fill" id="armour-fill"></div>
            <span class="hud-label">ARMURE</span>
        </div>
        <div id="money-display">
            <div class="money-row"><span class="money-icon">$</span> <span id="money-value">0</span></div>
            <div class="money-row bank"><span class="money-icon">B</span> <span id="bank-value">0</span></div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
